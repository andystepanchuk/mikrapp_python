{% extends "base.html" %}
{% block content %}
<div class="page-header"><h1>Sites</h1></div>

<section class="card">
  <h2>Add site</h2>
  <form method="post" action="/sites/add">
    <label>Name</label>
    <input type="text" name="name" required>
    <label>Location</label>
    <input type="text" name="location">
    <label>Description</label>
    <input type="text" name="description">
    <button type="submit" class="btn primary">Add site</button>
  </form>
</section>

<table class="device-table">
  <thead><tr><th>Name</th><th>Location</th><th>Devices</th><th></th></tr></thead>
  <tbody>
    {% for s in sites %}
    <tr>
      <td>{{ s.name }}</td>
      <td>{{ s.location }}</td>
      <td>{{ s.device_count }}</td>
      <td>
        <form method="post" action="/sites/{{ s.id }}/delete" onsubmit="return confirm('Delete this site? Its devices go too.')">
          <button type="submit" class="btn small danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
