<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikrApp{% if active %} - {{ active|capitalize }}{% endif %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">MikrApp</div>
    <nav>
      <a href="/" class="{{ 'active' if active=='dashboard' }}">Dashboard</a>
      <a href="/devices" class="{{ 'active' if active=='devices' }}">Devices</a>
      <a href="/topology" class="{{ 'active' if active=='topology' }}">Topology</a>
      <a href="/sites" class="{{ 'active' if active=='sites' }}">Sites</a>
      <a href="/commands" class="{{ 'active' if active=='commands' }}">Commands</a>
      <a href="/backups" class="{{ 'active' if active=='backups' }}">Backups</a>
      <a href="/logs" class="{{ 'active' if active=='logs' }}">Logs</a>
    </nav>
    <a href="/logout" class="logout">Log out</a>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
